<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expense Splitter with Groups</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Expense Splitter with Groups</h1>

  <!-- GROUPS HOME PAGE -->
  <section id="groups-section">
    <h2>Your Groups</h2>
    <input type="text" id="group-name-input" placeholder="Enter new group name" />
    <button id="add-group-btn">Create Group</button>
    <ul id="groups-list"></ul>
  </section>

  <!-- GROUP DETAIL PAGE -->
  <section id="group-detail-section" style="display:none;">
    <button id="back-to-groups">&larr; Back to Groups</button>

    <h2 id="current-group-title"></h2>

    <!-- Participants management -->
    <section id="participants-section">
      <h3>Add Participants</h3>
      <input type="text" id="participant-name" placeholder="Enter participant name" />
      <button id="add-participant">Add Participant</button>
      <ul id="participants-list"></ul>
    </section>

    <!-- Expenses management -->
    <section id="expenses-section" style="display:none;">
      <h3>Add Expense</h3>
      <label for="expense-desc">Description (optional):</label>
      <input type="text" id="expense-desc" placeholder="e.g. Dinner, Taxi" />

      <label for="expense-amount">Amount:</label>
      <input type="number" id="expense-amount" placeholder="Enter amount" min="0.01" step="0.01" />

      <label for="expense-paid-by">Paid By:</label>
      <select id="expense-paid-by"></select>

      <label>Split Among:</label>
      <div id="expense-participants" class="expense-participants"></div>

      <button id="add-expense">Add Expense</button>

      <h3>Expenses</h3>
      <ul id="expenses-list"></ul>
    </section>

    <hr />

    <section id="balances-section" style="display:none;">
      <h3>Balances</h3>
      <ul id="balances-list"></ul>
    </section>
  </section>

<script src="script.js"></script>
</body>
</html>
